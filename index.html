<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfólio de sites e landing pages</title>
<style>
*{box-sizing:border-box;margin:0}body{background:#1B1F23;color:#fff;font-family:Calibri,system-ui,sans-serif;padding:60px 24px}
.w{max-width:1100px;margin:0 auto}h1{font-family:Cambria,Georgia,serif;font-size:2.4rem;margin-bottom:8px}p.s{color:#b9bdc2;margin-bottom:40px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
a{color:inherit;text-decoration:none;background:#272c31;border-radius:14px;overflow:hidden;display:block;border:1px solid #3a4147;transition:.2s}
a:hover{transform:translateY(-4px);border-color:#B8663A}
img{width:100%;height:160px;object-fit:cover;display:block}div.t{padding:16px 18px}b{display:block;font-size:1.1rem}span{color:#b9bdc2;font-size:.9rem}
</style></head><body><div class="w">
<h1>Portfólio de sites e landing pages</h1><p class="s">Exemplos de demonstração. Marcas e textos fictícios.</p>
<div class="g">
<a href="clinica/"><img src="clinica/assets/hero.jpg" alt=""><div class="t"><b>Clínica de estética</b><span>Elegante, escuro e dourado</span></div></a>
<a href="imobiliaria/"><img src="imobiliaria/assets/hero.jpg" alt=""><div class="t"><b>Imobiliária</b><span>Moderno, com destaque de números</span></div></a>
<a href="eventos/"><img src="eventos/assets/hero.jpg" alt=""><div class="t"><b>Eventos e buffet</b><span>Claro, acolhedor, fotos grandes</span></div></a>
<a href="automotivo/"><img src="automotivo/assets/hero.jpg" alt=""><div class="t"><b>Centro automotivo</b><span>Técnico, azul, cards de serviços</span></div></a>
</div></div></body></html>
